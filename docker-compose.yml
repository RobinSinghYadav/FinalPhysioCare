services:
  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:4000
    ports:
      - "3000:80"
    environment:
      VITE_BACKEND_URL: http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      args:
        VITE_BACKEND_URL: http://localhost:4000
    ports:
      - "3001:80"
    environment:
      VITE_BACKEND_URL: http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped
